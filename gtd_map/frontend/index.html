<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <!-- Bump ?v= when map.css or map.js change, so browsers fetch the new files -->
  <link rel="stylesheet" href="map.css?v=5">
</head>
<body>
  <div id="map" role="region" aria-label="Map of events"></div>

  <div id="legend" class="panel" hidden></div>

  <div id="banner" class="panel" hidden></div>

  <aside id="card" class="panel" hidden aria-live="polite"></aside>

  <div id="timeline" class="panel" hidden>
    <button id="tl-play" class="icon-btn" type="button" aria-label="Play through the years" title="Play through the years">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="ico-play" d="M4 2.5v11l9-5.5z"/><path class="ico-pause" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
    </button>
    <div id="tl-label" aria-live="polite"></div>
    <canvas id="tl-chart" aria-label="Events per year. Click a year to show only that year on the map."></canvas>
    <button id="tl-clear" class="text-btn" type="button" hidden>All years</button>
  </div>

  <div id="tooltip" role="tooltip" hidden></div>
  <div id="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.3.11/dist.min.js"></script>
  <script src="map.js?v=5"></script>
</body>
</html>
